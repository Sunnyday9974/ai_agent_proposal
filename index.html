<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 초고속 실제화 센터</title>
    <style>
        :root {
            --primary-color: #0f172a; /* 더 깊고 전문적인 다크 네이비 */
            --brand-color: #1e40af; /* 신뢰감을 주는 블루 */
            --accent-color: #3b82f6; /* 포인트 스카이 블루 */
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-global: #f8fafc; /* 일체감을 주는 부드러운 배경 */
            --card-border: #e2e8f0;
            --success-color: #10b981;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-global);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 80px 20px;
        }
        
        /* 전체 영역을 하나의 유기적인 패널로 묶는 컨테이너 */
        .unified-wrapper {
            max-width: 1040px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(15, 23, 42, 0.03);
            padding: 60px 80px;
            overflow: hidden;
        }
        
        /* 1. 상단 빌드업 구역 (Unified Hero) */
        .hero-section {
            text-align: center;
            margin-bottom: 55px;
            position: relative;
        }
        
        /* 헤드라인 크기 정밀 다운사이징 */
        .hero-section h1 {
            font-size: 1.6rem; 
            color: #334155; /* 약간 더 부드러운 다크 그레이 */
            font-weight: 600; /* 질문은 너무 무겁지 않게 */
            line-height: 1.5;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            word-break: keep-all;
        }
        
        .hero-section h1 span {
            display: block;
            margin-top: 14px;
            font-size: 1.9rem; 
            color: var(--brand-color);
            font-weight: 800; /* 핵심 무기 강조 문구만 명확하게 극대화 */
            letter-spacing: -0.8px;
        }
        
        .hero-section .hero-desc {
            font-size: 1.15rem;
            color: var(--text-light);
            max-width: 820px;
            margin: 0 auto 35px;
            font-weight: 400;
            word-break: keep-all;
        }
        
        /* 핵심 가치 서브 패널 */
        .value-propositions {
            background-color: #f8fafc;
            border-left: 4px solid var(--brand-color);
            padding: 20px 28px;
            border-radius: 0 12px 12px 0;
            text-align: left;
            max-width: 850px;
            margin: 0 auto;
        }
        
        .value-propositions h3 {
            font-size: 1.05rem; /* 제목 크기 최적화 */
            color: var(--primary-color);
            margin-bottom: 6px;
            font-weight: 700;
        }
        
        .value-propositions p {
            font-size: 0.9rem; /* 글자 크기를 본문보다 작고 차분하게 축소 */
            color: var(--text-light);
            line-height: 1.6;
            word-break: keep-all;
        }
        
        /* 디자인적 공백으로 자연스럽게 연결 */
        .section-divider {
            height: 60px;
        }
        
        /* 2. 유스케이스 대시보드 구역 */
        .dashboard-title {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 28px;
            font-weight: 800;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dashboard-title::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }
        
        .grid-usecases {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 60px;
        }
        
        .usecase-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 28px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .usecase-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
            box-shadow: 0 12px 24px -10px rgba(59, 130, 246, 0.15);
        }
        
        .card-top {
            margin-bottom: 20px;
        }
        
        .card-tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        
        .tag-prod { background: #fff7ed; color: #ea580c; }
        .tag-office { background: #f0fdf4; color: #16a34a; }
        .tag-mkt { background: #faf5ff; color: #9333ea; }
        .tag-cs { background: #f1f5f9; color: #475569; }
        
        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
        
        .card-desc {
            font-size: 0.95rem;
            color: var(--text-light);
            word-break: keep-all;
        }
        
        .card-action {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--brand-color);
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--card-border);
        }
        
        /* 3. 하단 다이렉트 액션 구역 (Unified CTA) */
        .action-panel {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 45px 40px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
        }
        
        .action-panel h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        .action-panel p {
            font-size: 1.05rem;
            margin-bottom: 28px;
            opacity: 0.85;
            font-weight: 300;
            word-break: keep-all;
        }
        
        .btn-submit {
            display: inline-block;
            background: #ffffff;
            color: var(--primary-color);
            font-weight: 700;
            padding: 14px 42px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.05rem;
            transition: all 0.2s ease;
        }
        
        .btn-submit:hover {
            background: #f8fafc;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

            color
