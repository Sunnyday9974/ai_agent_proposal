<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무료 비즈니스 진단 및 AI Agent 상담 신청</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --brand-color: #1e40af;
            --accent-color: #3b82f6;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-global: #f8fafc;
            --card-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-global);
            color: var(--text-dark);
            line-height: 1.6;
            padding: 60px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .back-to-hub {
            display: inline-flex;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 25px;
            transition: color 0.2s;
            gap: 6px;
        }
        
        .back-to-hub:hover {
            color: var(--accent-color);
        }

        .main-title {
            font-size: 2rem;
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .main-subtitle {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 40px;
        }

        /* [핵심 수정] align-items: stretch를 적용하여 양쪽 카드의 높이를 100% 동기화 */
        .content-grid {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 30px;
            align-items: stretch; 
        }

        /* 왼쪽: 신청 폼 카드 스타일 */
        .form-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.02);
            border: 1px solid var(--card-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .form-card form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .form-group label span {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--text-dark);
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea.form-control {
            height: 120px;
            resize: vertical;
        }

        /* 개인정보 동의 영역 세련되게 스타일링 */
        .privacy-group {
            margin-top: 25px;
            background: var(--bg-global);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
        }

        .privacy-box h4 {
            font-size: 0.85rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .privacy-text {
            font-size: 0.8rem;
            color: var(--text-light);
            line-height: 1.5;
            height: 85px;
            overflow-y: auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem !important;
            font-weight: 600 !important;
            color: var(--primary-color) !important;
        }

        .checkbox-label input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 15px;
        }

        .btn-submit:hover {
            opacity: 0.95;
        }

        /* 오른쪽: 비즈니스 가이드 패널 스타일 (Flex 디자인 적용으로 좌측과 높이 일치) */
        .guide-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* 내부 콘텐츠가 상하로 알맞게 분산됨 */
        }

        .guide-box {
            margin-bottom: 25px;
        }

        .guide-box:nth-last-of-type(2) {
            margin-bottom: 0;
        }

        .guide-box h3 {
            font-size: 1.1rem;
            color: var(--brand-color);
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .guide-box ul {
            list-style: none;
        }

        .guide-box ul li {
            font-size: 0.92rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            position: relative;
            padding-left: 20px;
        }

        .guide-box ul li:last-child {
            margin-bottom: 0;
        }

        .guide-box ul li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--accent-color);
            font-weight: 700;
        }

        /* 비즈니스 모델 방어용 정책 안내 문구 */
        .policy-note {
            background-color: var(--bg-global);
            border-radius: 8px;
            padding: 18px;
            font-size: 0.85rem;
            color: var(--text-light);
            line-height: 1.55;
            margin-top: auto; /* 박
